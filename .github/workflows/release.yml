name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verdict:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compute release status
        run: |
          {
            echo "# Release status for ${{ github.ref_name }}"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          NOT_FIXED=$(grep -rL 'Status: fixed' assessment/evidence/findings/F-0*.md 2>/dev/null | tr '\n' ' ')
          if [ -n "$NOT_FIXED" ]; then
            echo "**RELEASE STATUS: BLOCKED** — findings not fixed: $NOT_FIXED" >> "$GITHUB_STEP_SUMMARY"
            echo "BLOCKED: $NOT_FIXED"
            exit 1
          fi
          echo "**RELEASE STATUS: READY**" >> "$GITHUB_STEP_SUMMARY"
          echo "READY"
  release:
    needs: verdict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --generate-notes --title "${{ github.ref_name }}"
